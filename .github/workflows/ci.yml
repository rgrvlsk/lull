name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test, clippy, fmt) on ${{ matrix.os }}
    # macos-14 is the oldest macOS lull supports (contract §10); the e2e suite and the live
    # ntstat test there catch kernel ABI differences before users do.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The e2e suite's test servers are `python3 -m http.server`; the runner's default
      # python3 lives inside Xcode under /Applications, which lull rightly treats as an
      # installed app (ADR-0002), so use a standalone Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  swift:
    name: Swift (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" && swift --version
      - run: swift build
        working-directory: macos
      - run: swift test
        working-directory: macos

  extension:
    name: Extension (tsc, tests, build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
