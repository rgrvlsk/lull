[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rgrvlsk/lull"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
lull-protocol = { path = "crates/protocol" }
lull-core = { path = "crates/core" }

[workspace.lints.clippy]
all = "warn"
